<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>URL Shortener</h1>
    <p class="subtitle">Short links, beautifully simple.</p>
    <form id="shorten-form" novalidate>
      <label class="field">
        <span>Long URL</span>
        <input id="url-input" type="url" required autocomplete="off" />
      </label>
      <label class="field">
        <span>Custom alias <em>(optional)</em></span>
        <input id="alias-input" type="text" pattern="[A-Za-z0-9_-]{1,32}" title="1-32 characters: letters, numbers, _ or -" autocomplete="off" spellcheck="false" />
      </label>
      <button type="submit" id="submit-btn">Shorten</button>
    </form>
    <div id="result" aria-live="polite"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
